{% extends 'base.html' %}

{% block title %}Sign in — Timesheet Manager{% endblock %}

{% block content %}
<section class="panel login-panel">
  <h2>Sign in</h2>
  <p class="panel-help">Use the username and password provided by your administrator.</p>
  <form method="post" class="form">
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    {% endfor %}
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</section>
{% endblock %}
